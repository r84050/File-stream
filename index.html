<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:      #0e0f11;
      --surface: #16181c;
      --border:  #2a2d35;
      --accent:  #5b7bff;
      --accent2: #a78bfa;
      --text:    #e8eaf0;
      --muted:   #6b7280;
      --danger:  #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    #error strong { color: var(--danger); font-size: 16px; }
    #error p { color: var(--muted); font-size: 14px; }

    #player-wrap { display: none; }

    video {
      width: 100%;
      max-height: 56vw;
      background: #000;
      display: block;
    }

    .buffer-bar { height: 3px; background: var(--border); }
    .buffer-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s;
    }

    .status-bar {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .info { padding: 16px; }
    .title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading video...</p>
  </div>

  <div id="error">
    <div style="font-size:40px">⚠️</div>
    <strong id="err-title">Something went wrong</strong>
    <p id="err-msg"></p>
  </div>

  <div id="player-wrap">
    <video id="vid" controls playsinline preload="metadata"></video>
    <div class="buffer-bar"><div class="buffer-fill" id="buf"></div></div>
    <div class="status-bar">
      <div class="dot" id="dot"></div>
      <span id="status">Ready</span>
    </div>
    <div class="info">
      <div class="title" id="vid-title">—</div>
      <div class="badges">
        <div class="badge">📦 <strong id="vid-size">—</strong></div>
        <div class="badge" id="dur-badge" style="display:none">⏱ <strong id="vid-dur">—</strong></div>
        <div class="badge">🎞 <strong id="vid-mime">—</strong></div>
      </div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.expand(); tg.ready(); }

  const STREAM_SERVER_URL = "https://tgfilestor-f8d.n.jrnm.app/";
  const params = new URLSearchParams(window.location.search);
  const msgId  = params.get("msg");
  const SRV    = (params.get("srv") || STREAM_SERVER_URL).replace(/\/$/, "");

  function fmtSize(b) {
    const u = ["B","KB","MB","GB","TB"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return `${b.toFixed(1)} ${u[i]}`;
  }

  function fmtDur(s) {
    if (!s) return null;
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return h
      ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
      : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  function showError(title, msg) {
    document.getElementById("loading").style.display     = "none";
    document.getElementById("player-wrap").style.display = "none";
    const el = document.getElementById("error");
    el.style.display = "flex";
    document.getElementById("err-title").textContent = title;
    document.getElementById("err-msg").textContent   = msg;
  }

  function setStatus(text, live = false) {
    document.getElementById("status").textContent = text;
    document.getElementById("dot").className = "dot" + (live ? " live" : "");
  }

  if (!msgId)       showError("Invalid Link", "No video ID in URL.");
  else if (!SRV)    showError("Not Configured", "Stream server URL missing.");
  else              loadVideo();

  async function loadVideo() {
    let info;
    try {
      const res = await fetch(`${SRV}/info?msg=${msgId}`);
      if (!res.ok) throw new Error(`${res.status}`);
      info = await res.json();
    } catch(e) {
      showError("Video Not Found", "This video may have been deleted or the link is invalid.");
      return;
    }

    document.getElementById("vid-title").textContent = info.title || "Video";
    document.getElementById("vid-size").textContent  = fmtSize(info.size || 0);
    document.getElementById("vid-mime").textContent  = (info.mime_type||"video/mp4").replace("video/","").toUpperCase();

    const dur = fmtDur(info.duration);
    if (dur) {
      document.getElementById("vid-dur").textContent = dur;
      document.getElementById("dur-badge").style.display = "flex";
    }

    const vid = document.getElementById("vid");
    vid.src = `${SRV}/stream?msg=${msgId}`;

    vid.addEventListener("waiting", () => setStatus("Buffering...", true));
    vid.addEventListener("playing", () => setStatus("Playing", true));
    vid.addEventListener("pause",   () => setStatus("Paused"));
    vid.addEventListener("ended",   () => setStatus("Finished"));
    vid.addEventListener("error",   () => setStatus("Stream error ⚠️"));
    vid.addEventListener("canplay", () => setStatus("Ready to play"));

    vid.addEventListener("progress", () => {
      if (vid.buffered.length && vid.duration) {
        const pct = (vid.buffered.end(vid.buffered.length-1) / vid.duration) * 100;
        document.getElementById("buf").style.width = pct + "%";
      }
    });

    document.getElementById("loading").style.display     = "none";
    document.getElementById("player-wrap").style.display = "block";
    setStatus("Ready to play");
  }
</script>
</body>
</html>
