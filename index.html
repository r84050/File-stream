<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:        #0e0f11;
      --surface:   #16181c;
      --border:    #2a2d35;
      --accent:    #5b7bff;
      --accent2:   #a78bfa;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --danger:    #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      color: var(--muted);
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: var(--danger);
    }
    #error p { color: var(--muted); font-size: 14px; }

    /* ── Player ── */
    #player-wrap { display: none; }

    .video-box {
      background: #000;
      position: relative;
      width: 100%;
    }

    video {
      width: 100%;
      display: block;
      max-height: 56vw;   /* 16:9 on mobile */
      background: #000;
    }

    /* ── Info panel ── */
    .info {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .badge span { font-size: 14px; }

    /* ── Progress bar (buffered) ── */
    .buffer-bar {
      height: 3px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }
    .buffer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading video...</p>
  </div>

  <!-- Error state -->
  <div id="error">
    <div style="font-size:40px">⚠️</div>
    <strong id="err-title">Something went wrong</strong>
    <p id="err-msg">Could not load the video.</p>
  </div>

  <!-- Player -->
  <div id="player-wrap">
    <div class="video-box">
      <video
        id="vid"
        controls
        playsinline
        preload="metadata"
      ></video>
    </div>

    <div class="buffer-bar">
      <div class="buffer-fill" id="buf"></div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>

    <div class="info">
      <div class="title" id="vid-title">—</div>
      <div class="badges">
        <div class="badge"><span>📦</span><strong id="vid-size">—</strong></div>
        <div class="badge" id="dur-badge" style="display:none">
          <span>⏱</span><strong id="vid-dur">—</strong>
        </div>
        <div class="badge"><span>🎞</span><strong id="vid-mime">—</strong></div>
      </div>
    </div>
  </div>

<script>
  /* ── Default Stream Server URL ── */
  const STREAM_SERVER_URL = "https://telegramfi-688.n.jrnm.app/";

  /* ── Parse URL params (bot embeds both msg id and stream server URL) ── */
  const params       = new URLSearchParams(window.location.search);
  const msgId        = params.get("msg");
  const STREAM_SERVER = params.get("stream") || STREAM_SERVER_URL;

  /* ── Telegram WebApp init ── */
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.expand(); tg.ready(); }

  /* ── Helpers ── */
  function fmtSize(b) {
    const u = ["B","KB","MB","GB","TB"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return `${b.toFixed(1)} ${u[i]}`;
  }

  function fmtDur(s) {
    if (!s) return null;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h
      ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
      : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  function showError(title, msg) {
    document.getElementById("loading").style.display    = "none";
    document.getElementById("player-wrap").style.display = "none";
    const el = document.getElementById("error");
    el.style.display = "flex";
    document.getElementById("err-title").textContent = title;
    document.getElementById("err-msg").textContent   = msg;
  }

  function setStatus(text, live = false) {
    document.getElementById("status-text").textContent = text;
    document.getElementById("status-dot").className = "status-dot" + (live ? " live" : "");
  }

  /* ── Decide what to show ── */
  if (!msgId) {
    // Opened from the generic persistent menu button, not a video link.
    showError("No Video Selected", "Open a shared video link from the bot to start watching.");
  } else {
    loadVideo(msgId);
  }

  async function loadVideo(id) {
    /* 1. Fetch metadata */
    let info;
    try {
      const res = await fetch(`${STREAM_SERVER}/info?msg=${id}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      info = await res.json();
    } catch (e) {
      showError("Video Not Found", "This video may have been deleted or the link is invalid.");
      return;
    }

    /* 2. Populate UI */
    document.getElementById("vid-title").textContent = info.title || "Video";
    document.getElementById("vid-size").textContent  = fmtSize(info.size || 0);
    document.getElementById("vid-mime").textContent  =
      (info.mime_type || "video/mp4").replace("video/", "").toUpperCase();

    const dur = fmtDur(info.duration);
    if (dur) {
      document.getElementById("vid-dur").textContent = dur;
      document.getElementById("dur-badge").style.display = "flex";
    }

    /* 3. Set video source — browser handles Range requests automatically */
    const vid = document.getElementById("vid");
    vid.src = `${STREAM_SERVER}/stream?msg=${id}`;

    /* 4. Video events */
    vid.addEventListener("waiting",  () => setStatus("Buffering...", true));
    vid.addEventListener("playing",  () => setStatus("Playing", true));
    vid.addEventListener("pause",    () => setStatus("Paused"));
    vid.addEventListener("ended",    () => setStatus("Finished"));
    vid.addEventListener("error",    () => setStatus("Stream error ⚠️"));
    vid.addEventListener("canplay",  () => setStatus("Ready to play"));

    vid.addEventListener("progress", () => {
      if (vid.buffered.length > 0 && vid.duration) {
        const pct = (vid.buffered.end(vid.buffered.length - 1) / vid.duration) * 100;
        document.getElementById("buf").style.width = pct + "%";
      }
    });

    /* 5. Show player */
    document.getElementById("loading").style.display     = "none";
    document.getElementById("player-wrap").style.display = "block";
    setStatus("Ready to play");
  }
</script>
</body>
</html>
